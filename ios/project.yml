name: Mossling
options:
  bundleIdPrefix: app.mossling
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    # the App filing number (工信部 App 备案), shown in 关于 once set; empty until the filing is done
    MOSSLING_ICP: ""
    # the developer named in the privacy policy, terms and disclaimer (the same as the App filing), and the contact
    # email for questions, complaints and the children's information officer; until set, the documents point to the
    # developer name and 「App 支持」 link on the App Store page, and 反馈问题 is hidden
    MOSSLING_DEVELOPER: ""
    MOSSLING_EMAIL: ""
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Mossling:
    type: application
    platform: iOS
    sources:
      - path: Mossling
        excludes: ["Resources/AppIcon.icon/**"]
      - path: Mossling/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Shared
      - path: ../app/src/main/assets/content.json
        buildPhase: resources
      - path: ../app/src/main/assets/who_growth.json
        buildPhase: resources
      - path: Art/art
        type: folder
        buildPhase: resources
      - path: Docs
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mossling
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Mossling/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Mossling/Resources/Mossling.entitlements
    dependencies:
      - target: MosslingWidget
  MosslingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: Mossling/Domain/Age.swift
      - path: Art/widget
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mossling.widget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
  MosslingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MosslingTests]
    dependencies:
      - target: Mossling
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mossling.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mossling"
        BUNDLE_LOADER: "$(TEST_HOST)"
  MosslingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MosslingUITests]
    dependencies:
      - target: Mossling
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mossling
schemes:
  Mossling:
    build:
      targets:
        Mossling: all
        MosslingTests: [test]
        MosslingUITests: [test]
    test:
      targets: [MosslingTests, MosslingUITests]
