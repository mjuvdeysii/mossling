name: Mossling
options:
  bundleIdPrefix: app.mossling
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Mossling:
    type: application
    platform: iOS
    sources:
      - path: Mossling
      - path: ../app/src/main/assets/content.json
        buildPhase: resources
      - path: ../app/src/main/assets/who_growth.json
        buildPhase: resources
      - path: ../app/src/main/assets/art
        type: folder
        buildPhase: resources
      - path: ../app/src/main/res/font/young_serif.ttf
        buildPhase: resources
      - path: ../app/src/main/res/font/noto_serif_sc_semibold.ttf
        buildPhase: resources
      - path: ../TERMS.md
        buildPhase: resources
      - path: ../PRIVACY.md
        buildPhase: resources
      - path: ../DISCLAIMER.md
        buildPhase: resources
      - path: ../CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mossling
        INFOPLIST_FILE: Mossling/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  MosslingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MosslingTests]
    dependencies:
      - target: Mossling
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mossling.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mossling"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Mossling:
    build:
      targets:
        Mossling: all
        MosslingTests: [test]
    test:
      targets: [MosslingTests]
