name: iOS
# Builds the iOS app with the newest Xcode on the runner, runs the tests in the iPhone simulator, and publishes the
# rendered screens to the screens-ios branch for review.
on:
  push:
    branches: [main]
    paths: ["ios/**", "app/src/main/assets/**", "*.md", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"
          brew install xcodegen >/dev/null
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Test in the simulator
        working-directory: ios
        run: |
          set -o pipefail
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          import re
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if re.fullmatch(r'iPhone \\d+', x['name'])]
          c.sort(key=lambda t:(t[0],t[1]['name'])); print(c[-1][1]['udid'])")
          echo "::notice title=Simulator::$DEV"
          mkdir -p "$PWD/shots"
          TEST_RUNNER_SNAPSHOT_DIR="$PWD/shots" xcodebuild test -project Mossling.xcodeproj -scheme Mossling -destination "id=$DEV" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: unre|Test Case.*(passed|failed)|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log
      - name: Report errors
        if: failure()
        working-directory: ios
        run: |
          grep -E "error:|failed|XCTAssert" build.log | sort -u | head -60 | while IFS= read -r l; do echo "::error::$(echo "$l" | sed 's/%/%25/g')"; done
      - name: Publish screens
        if: always()
        continue-on-error: true
        run: |
          [ -d ios/shots ] && [ "$(ls ios/shots)" ] || exit 0
          mkdir -p /tmp/s && cp ios/shots/* /tmp/s/
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan s-tmp && git rm -rqf --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/s/* . && echo "${GITHUB_SHA}" > COMMIT && git add -A && git commit -qm "ios screens ${GITHUB_SHA}" && git push -qf origin s-tmp:screens-ios
