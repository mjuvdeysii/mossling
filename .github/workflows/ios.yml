name: iOS
# Builds the iOS app with the newest Xcode on the runner, runs the tests in the iPhone simulator, and publishes the
# rendered screens to the screens-ios branch for review.
on:
  push:
    branches: [main]
    paths: ["ios/**", "app/src/main/assets/**", "*.md", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"
          brew install xcodegen >/dev/null
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Test in the simulator
        working-directory: ios
        run: |
          set -o pipefail
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          import re
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if re.fullmatch(r'iPhone \\d+', x['name'])]
          c.sort(key=lambda t:(t[0],t[1]['name'])); print(c[-1][1]['udid'])")
          echo "::notice title=Simulator::$DEV"
          mkdir -p "$PWD/shots"
          TEST_RUNNER_SNAPSHOT_DIR="$PWD/shots" xcodebuild test -project Mossling.xcodeproj -scheme Mossling -destination "id=$DEV" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: unre|Test Case.*(passed|failed)|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log
      - name: App icon check
        if: always()
        continue-on-error: true
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/Mossling.app" -maxdepth 6 | head -1)
          plutil -p "$APP/Info.plist" | grep -A8 CFBundleIcons | tr '\n' ' ' | sed 's/^/::notice title=Icons::/'; echo
          ls "$APP" | grep -i -E "icon|Assets.car" | tr '\n' ' ' | sed 's/^/::notice title=Bundle::/'; echo
          grep -iE "AppIcon|actool.*warning|\.icon" ios/build.log | head -8 | while IFS= read -r l; do echo "::notice title=actool::$l"; done
      - name: Report errors
        if: failure()
        working-directory: ios
        run: |
          grep -E "error:|failed|XCTAssert" build.log | sort -u | head -60 | while IFS= read -r l; do echo "::error::$(echo "$l" | sed 's/%/%25/g')"; done
      - name: Publish screens
        if: always()
        continue-on-error: true
        run: |
          [ -d ios/shots ] && [ "$(ls ios/shots)" ] || exit 0
          mkdir -p /tmp/s && cp ios/shots/* /tmp/s/
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan s-tmp && git rm -rqf --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/s/* . && echo "${GITHUB_SHA}" > COMMIT && git add -A && git commit -qm "ios screens ${GITHUB_SHA}" && git push -qf origin s-tmp:screens-ios
  testflight:
    # Signs with the developer account's App Store Connect API key and uploads the build to TestFlight.
    # Runs only when the secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID are set.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.ASC_KEY_ID != ''
      - name: Archive and upload
        if: env.ASC_KEY_ID != ''
        working-directory: ios
        run: |
          set -o pipefail
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); sudo xcode-select -s "$X"
          # The app group (shared journal for the widget) is used only once it is set up on the developer account:
          # repository variable APP_GROUP=1. Until then the app and widget are signed without it.
          if [ "${{ vars.APP_GROUP }}" != "1" ]; then
            for f in Mossling/Resources/Mossling.entitlements Widget/Widget.entitlements; do
              printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict/></plist>\n' > "$f"
            done
          fi
          brew install xcodegen >/dev/null && xcodegen generate
          mkdir -p ~/private_keys && printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          # The archive is built unsigned and signed only at export, with the account's cloud-managed distribution
          # certificate, so no new development certificate is created on each run (the account allows only a few).
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          BUILD=$((100 + ${{ github.run_number }}))
          xcodebuild archive -project Mossling.xcodeproj -scheme Mossling -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Mossling.xcarchive DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION=$BUILD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee archive.log | grep -E "error:|\*\* " || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          # The archive is unsigned, so it carries no entitlements of its own; export signs with what the binaries
          # declare. Sign them ad hoc (no certificate) with their entitlements — the widget first, then the app — so the
          # app group reaches the exported build, and print what each one now declares.
          APPDIR=build/Mossling.xcarchive/Products/Applications/Mossling.app
          for x in "$APPDIR"/PlugIns/*.appex; do codesign -f -s - --entitlements Widget/Widget.entitlements "$x"; done
          codesign -f -s - --entitlements Mossling/Resources/Mossling.entitlements "$APPDIR"
          for x in "$APPDIR" "$APPDIR"/PlugIns/*.appex; do echo "::notice title=Entitlements $(basename "$x")::$(codesign -d --entitlements - --xml "$x" 2>/dev/null | tr -d '\n\t' | sed 's/.*<dict>//;s/<\/dict>.*//')"; done
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Mossling.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export "${AUTH[@]}" 2>&1 | tee export.log | grep -E "error:|Upload|\*\* " || true
          grep -q "EXPORT SUCCEEDED" export.log
          echo "::notice title=TestFlight::build $BUILD uploaded; it appears in TestFlight after Apple finishes processing (usually 10–30 minutes)"
      - name: Report errors
        if: failure()
        working-directory: ios
        run: cat archive.log export.log 2>/dev/null | grep -E "error:|Error|failed" | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done
