name: iOS
# Builds the iOS app with the newest Xcode on the runner, runs the tests in the iPhone simulator and, from main, uploads
# to TestFlight. Kept fast: the accessibility audit and the published screens run only when a manual run asks for them.
on:
  push:
    branches: [main]
    paths: ["ios/**", "app/src/main/assets/**", "*.md", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      screens:
        description: "Publish the rendered screens (small) to a branch shots-<sha>"
        type: boolean
        default: false
      audit:
        description: "Run the accessibility audit (about 20 minutes)"
        type: boolean
        default: false
      perf:
        description: "Measure scrolling (hitch time ratio) on the home, 3D and 2D"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"
          brew install xcodegen >/dev/null
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Test in the simulator
        working-directory: ios
        run: |
          set -o pipefail
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          import re
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if re.fullmatch(r'iPhone \\d+', x['name'])]
          c.sort(key=lambda t:(t[0],t[1]['name'])); print(c[-1][1]['udid'])")
          echo "::notice title=Simulator::$DEV"
          mkdir -p "$PWD/shots"
          echo "$DEV" > sim.txt
          # network probe: every network event the app's own processes make while the tests run (the app should make none;
          # in China a first network use shows the system's 无线数据 prompt)
          xcrun simctl boot "$DEV" 2>/dev/null || true
          xcrun simctl spawn "$DEV" log stream --style compact --level debug \
            --predicate '(process BEGINSWITH "Mossling") AND (subsystem == "com.apple.network" OR subsystem == "com.apple.CFNetwork" OR subsystem == "com.apple.nsurlsessiond")' > net.log 2>&1 &
          echo $! > net.pid
          TEST_RUNNER_SNAPSHOT_DIR="$PWD/shots" xcodebuild test -project Mossling.xcodeproj -scheme Mossling -destination "id=$DEV" \
            -skip-testing:MosslingUITests CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: unre|Test Case.*(passed|failed)|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log
      - name: Accessibility audit
        # Xcode's accessibility audit on each tab (default and largest text); the findings go out with the screens.
        # It reports, never blocks; it runs only when asked for (it takes about 20 minutes), so a build ships fast.
        if: success() && inputs.audit
        continue-on-error: true
        timeout-minutes: 20
        working-directory: ios
        run: |
          TEST_RUNNER_SNAPSHOT_DIR="$PWD/shots" xcodebuild test -project Mossling.xcodeproj -scheme Mossling -destination "id=$(cat sim.txt)" \
            -only-testing:MosslingUITests CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|Test Case.*(passed|failed)|\*\* " || true
      - name: Scroll performance
        if: success() && inputs.perf
        continue-on-error: true
        timeout-minutes: 25
        working-directory: ios
        run: |
          xcodebuild test -project Mossling.xcodeproj -scheme Mossling -destination "id=$(cat sim.txt)" \
            -only-testing:MosslingUITests/ScrollPerfTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee perf.log | grep -E "Test Case.*(passed|failed)|\*\* " || true
          grep -iE "hitch|measured \[" perf.log | sed -E 's/.*(testHomeScroll[23]D).*measured \[([^]]+)\].*average: ([0-9.]+).*/\1 \2 avg \3/' | head -20 | while IFS= read -r l; do echo "::notice title=Scroll::$l"; done
      - name: Network probe report
        if: always()
        continue-on-error: true
        working-directory: ios
        run: |
          kill "$(cat net.pid 2>/dev/null)" 2>/dev/null || true
          mkdir -p shots
          { echo "Network events from the app's processes during the simulator tests ($(wc -l < net.log 2>/dev/null) log lines)"
            echo "-- connections and requests --"
            grep -E "nw_connection|nw_endpoint|Task <|hostname|https?://|resolver|Connection [0-9]+" net.log | sed -E 's/^[0-9-]+ [0-9:.]+ //' | sort | uniq -c | sort -rn | head -80
            echo "-- every line, deduplicated (timestamps and ids removed) --"
            sed -E 's/^[0-9-]+ [0-9:.]+ //; s/\[[0-9:]+\]//g; s/0x[0-9a-f]+//g' net.log | cut -c1-220 | sort | uniq -c | sort -rn | head -60
          } > shots/ios_network.txt
          head -40 shots/ios_network.txt | while IFS= read -r l; do echo "::notice title=Network::$l"; done
      - name: App icon check
        if: always()
        continue-on-error: true
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/Mossling.app" -maxdepth 6 | head -1)
          plutil -p "$APP/Info.plist" | grep -A8 CFBundleIcons | tr '\n' ' ' | sed 's/^/::notice title=Icons::/'; echo
          ls "$APP" | grep -i -E "icon|Assets.car" | tr '\n' ' ' | sed 's/^/::notice title=Bundle::/'; echo
          grep -iE "AppIcon|actool.*warning|\.icon" ios/build.log | head -8 | while IFS= read -r l; do echo "::notice title=actool::$l"; done
      - name: Report errors
        if: failure()
        working-directory: ios
        run: |
          grep -E "error:|failed|XCTAssert" build.log | sort -u | head -60 | while IFS= read -r l; do echo "::error::$(echo "$l" | sed 's/%/%25/g')"; done
      - name: Publish screens
        # only when asked for: the screens, made small (600 points wide), to a branch of their own — a few megabytes,
        # pushed in seconds
        if: always() && inputs.screens
        timeout-minutes: 8
        continue-on-error: true
        run: |
          [ -d ios/shots ] && [ "$(ls ios/shots)" ] || exit 0
          mkdir -p /tmp/s && for f in ios/shots/*; do case "$f" in *.png) sips --resampleWidth 600 "$f" --out "/tmp/s/$(basename "$f")" >/dev/null;; *) cp "$f" /tmp/s/;; esac; done
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan s-small && git rm -rqf --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/s/* . && echo "${GITHUB_SHA}" > COMMIT && git add -A && git commit -qm "ios screens ${GITHUB_SHA}" && git push -q origin s-small:refs/heads/shots-${GITHUB_SHA::7}
  testflight:
    # Signs with the developer account's App Store Connect API key and uploads the build to TestFlight.
    # Runs only when the secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID are set.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.ASC_KEY_ID != ''
      - name: Archive and upload
        if: env.ASC_KEY_ID != ''
        working-directory: ios
        run: |
          set -o pipefail
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); sudo xcode-select -s "$X"
          # The app group (shared journal for the widget) is used only once it is set up on the developer account:
          # repository variable APP_GROUP=1. Until then the app and widget are signed without it.
          if [ "${{ vars.APP_GROUP }}" != "1" ]; then
            for f in Mossling/Resources/Mossling.entitlements Widget/Widget.entitlements; do
              printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict/></plist>\n' > "$f"
            done
          fi
          brew install xcodegen >/dev/null && xcodegen generate
          mkdir -p ~/private_keys && printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          # The archive is built unsigned and signed only at export, with the account's cloud-managed distribution
          # certificate, so no new development certificate is created on each run (the account allows only a few).
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          BUILD=$((100 + ${{ github.run_number }}))
          xcodebuild archive -project Mossling.xcodeproj -scheme Mossling -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Mossling.xcarchive DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION=$BUILD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee archive.log | grep -E "error:|\*\* " || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          # The archive is unsigned, so it carries no entitlements of its own; export signs with what the binaries
          # declare. Sign them ad hoc (no certificate) with their entitlements — the widget first, then the app — so the
          # app group reaches the exported build, and print what each one now declares.
          APPDIR=build/Mossling.xcarchive/Products/Applications/Mossling.app
          for x in "$APPDIR"/PlugIns/*.appex; do codesign -f -s - --entitlements Widget/Widget.entitlements "$x"; done
          codesign -f -s - --entitlements Mossling/Resources/Mossling.entitlements "$APPDIR"
          for x in "$APPDIR" "$APPDIR"/PlugIns/*.appex; do echo "::notice title=Entitlements $(basename "$x")::$(codesign -d --entitlements - --xml "$x" 2>/dev/null | tr -d '\n\t' | sed 's/.*<dict>//;s/<\/dict>.*//')"; done
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Mossling.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export "${AUTH[@]}" 2>&1 | tee export.log | grep -E "error:|Upload|\*\* " || true
          grep -q "EXPORT SUCCEEDED" export.log
          echo "::notice title=TestFlight::build $BUILD uploaded; it appears in TestFlight after Apple finishes processing (usually 10–30 minutes)"
      - name: Certificate for the App filing (备案 public key and SHA-1)
        # The account's distribution certificate is cloud-managed and cannot be downloaded, so the facts are read
        # from the certificate that actually signs the app: the archive is exported once more to a local .ipa and
        # the leaf certificate is taken from the app's signature.
        if: env.ASC_KEY_ID != ''
        continue-on-error: true
        working-directory: ios
        run: |
          sed 's#<string>upload</string>#<string>export</string>#' ExportOptions.plist > ExportLocal.plist
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -exportArchive -archivePath build/Mossling.xcarchive -exportOptionsPlist ExportLocal.plist -exportPath build/local "${AUTH[@]}" > export-local.log 2>&1 || { tail -5 export-local.log; exit 0; }
          mkdir -p build/ipa && unzip -q -o build/local/*.ipa -d build/ipa
          cd build/ipa && codesign -d --extract-certificates=cert Payload/*.app 2>/dev/null
          SHA1=$(openssl x509 -inform der -in cert0 -noout -fingerprint -sha1 | cut -d= -f2)
          MOD=$(openssl x509 -inform der -in cert0 -noout -modulus | cut -d= -f2)
          SUBJ=$(openssl x509 -inform der -in cert0 -noout -subject -enddate | tr '\n' ' ')
          echo "::notice title=备案证书::$SUBJ"
          echo "::notice title=备案 SHA-1::$SHA1"
          echo "::notice title=备案 公钥（RSA 模数，十六进制）::$MOD"
      - name: Report errors
        if: failure()
        working-directory: ios
        run: cat archive.log export.log 2>/dev/null | grep -E "error:|Error|failed" | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done
