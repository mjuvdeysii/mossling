name: Build
# Unit tests, Paparazzi screenshots of every screen, and a signed release APK.
# A push to main whose VERSION has no release yet publishes that version; other pushes only build and test.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # VERSION holds the next version. On main, if no release v<VERSION> exists yet, this build becomes that release;
          # otherwise it is only built and tested. Bump VERSION (and RELEASE_NOTES.md) to release the next one.
          base=$(cat VERSION); release=0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF#refs/tags/v}"; release=1
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! gh release view "v$base" >/dev/null 2>&1; then name="$base"; release=1
          else name="${base}.${{ github.run_number }}"; fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"; echo "RELEASE=$release" >> "$GITHUB_ENV"; echo "VERSION_CODE=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Unit tests and screenshots
        run: |
          set -o pipefail
          gradle :app:recordPaparazziDebug --no-daemon --stacktrace 2>&1 | tee build-test.log
      - name: Report compile and test errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|FAILED|What went wrong|Exception|expected:" build-test.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build::${msg}"
      - name: Signing key
        env:
          HB_KEYSTORE_B64: ${{ secrets.HB_KEYSTORE_B64 }}
        run: |
          if [ -n "$HB_KEYSTORE_B64" ]; then echo "$HB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "HB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; else echo "::warning title=Signing::no HB_KEYSTORE_B64 secret — the APK is signed with the debug key"; fi
      - name: Release APK
        env:
          HB_KEYSTORE_PASSWORD: ${{ secrets.HB_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build-release.log
          cp app/build/outputs/apk/release/app-release.apk "mossling-${VERSION_NAME}.apk"
      - name: Report release build errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|FAILED|What went wrong|R8|Missing class" build-release.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Release build::${msg}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mossling-apk
          path: mossling-*.apk
          retention-days: 30
      - name: Release
        if: success() && env.RELEASE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="RELEASE_NOTES.md"; [ -f "$notes" ] || notes=/dev/null
          gh release create "v${VERSION_NAME}" "mossling-${VERSION_NAME}.apk" --target "${GITHUB_SHA}" --title "摸索台灯 Mossling ${VERSION_NAME}" --notes-file "$notes" --latest
      - name: Keep only the current release
        # 1.0 started the record: earlier versions and previews were removed when it was published.
        if: success() && env.RELEASE == '1' && env.VERSION_NAME == '1.0.0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' | while read -r t; do
            [ "$t" = "v${VERSION_NAME}" ] || gh release delete "$t" --yes --cleanup-tag || true
          done
          gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate -q '.[].name' | while read -r t; do
            [ "$t" = "v${VERSION_NAME}" ] || gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$t" || true
          done
      - name: Publish screenshots to the screens branch (for review)
        if: always()
        continue-on-error: true
        run: |
          [ -d app/src/test/snapshots/images ] || exit 0
          mkdir -p /tmp/screens && cp -r app/src/test/snapshots/images/. /tmp/screens/ && cp build-test.log /tmp/screens/ 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan screens-tmp && git rm -rqf --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/screens/. . && echo "${GITHUB_SHA}" > COMMIT && git add -A && git commit -qm "screens ${GITHUB_SHA}" && git push -qf origin screens-tmp:screens
