name: Build
# Unit tests, Paparazzi screenshots of every screen, and a signed release APK.
# Every push to main publishes the prerelease "preview"; a tag v* publishes that version as a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Version
        run: |
          base=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF#refs/tags/v}"; else name="${base}-preview.${{ github.run_number }}"; fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"; echo "VERSION_CODE=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Unit tests and screenshots
        run: |
          set -o pipefail
          gradle :app:recordPaparazziDebug --no-daemon --stacktrace 2>&1 | tee build-test.log
      - name: Report compile and test errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|FAILED|What went wrong|Exception|expected:" build-test.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build::${msg}"
      - name: Signing key
        env:
          HB_KEYSTORE_B64: ${{ secrets.HB_KEYSTORE_B64 }}
        run: |
          if [ -n "$HB_KEYSTORE_B64" ]; then echo "$HB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "HB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; else echo "::warning title=Signing::no HB_KEYSTORE_B64 secret — the APK is signed with the debug key"; fi
      - name: Release APK
        env:
          HB_KEYSTORE_PASSWORD: ${{ secrets.HB_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build-release.log
          cp app/build/outputs/apk/release/app-release.apk "mossling-${VERSION_NAME}.apk"
      - name: Report release build errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|FAILED|What went wrong|R8|Missing class" build-release.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Release build::${msg}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mossling-apk
          path: mossling-*.apk
          retention-days: 30
      - name: Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="RELEASE_NOTES.md"; [ -f "$notes" ] || notes=/dev/null
          gh release create "${GITHUB_REF#refs/tags/}" "mossling-${VERSION_NAME}.apk" --title "Mossling 苔生 ${VERSION_NAME}" --notes-file "$notes"
      - name: Preview release
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true
          gh release create preview "mossling-${VERSION_NAME}.apk" --prerelease --target "${GITHUB_SHA}" \
            --title "Mossling 苔生 预览 ${VERSION_NAME}" --notes "main 分支最新一次构建。正式版本见带 v 的发布。"
      - name: Publish screenshots to the screens branch (for review)
        if: always()
        continue-on-error: true
        run: |
          [ -d app/src/test/snapshots/images ] || exit 0
          mkdir -p /tmp/screens && cp -r app/src/test/snapshots/images/. /tmp/screens/ && cp build-test.log /tmp/screens/ 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan screens-tmp && git rm -rqf --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/screens/. . && echo "${GITHUB_SHA}" > COMMIT && git add -A && git commit -qm "screens ${GITHUB_SHA}" && git push -qf origin screens-tmp:screens
